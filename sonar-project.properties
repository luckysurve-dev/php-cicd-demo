
# SonarQube Cloud project configuration

sonar.projectKey=YOUR_PROJECT_KEY
sonar.organization=YOUR_ORGANIZATION_KEY

sonar.projectName=PHP CI CD Demo
sonar.projectVersion=1.0

# Source directories
sonar.sources=src,public

# Test directory
sonar.tests=tests

# Encoding
sonar.sourceEncoding=UTF-8

# Exclude dependencies and generated files
sonar.exclusions=**/vendor/**,**/node_modules/**,**/cache/**,**/storage/**,**/*.min.js,**/*.min.css

# Exclude test files from source analysis
sonar.test.exclusions=**/vendor/**

# PHP coverage (optional, only if generated)
# sonar.php.coverage.reportPaths=coverage.xml